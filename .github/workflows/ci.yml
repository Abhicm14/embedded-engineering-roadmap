name: Embedded CI & Automated Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-code-examples:
    name: Build & Run C Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchains & Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-arm-none-eabi make

      - name: Test Circular Buffer
        run: |
          gcc -Wall -Wextra -Werror -std=c99 code-examples/c/circular_buffer.c -o test_cb
          ./test_cb

      - name: Test Finite State Machine
        run: |
          gcc -Wall -Wextra -Werror -std=c99 code-examples/c/fsm.c -o test_fsm
          ./test_fsm

      - name: Test Switch Debouncer
        run: |
          gcc -Wall -Wextra -Werror -std=c99 code-examples/c/debounce.c -o test_debounce
          ./test_debounce

      - name: Test CRC Calculations
        run: |
          gcc -Wall -Wextra -Werror -std=c99 code-examples/c/crc.c -o test_crc
          ./test_crc

      - name: Test Bitwise Operations
        run: |
          gcc -Wall -Wextra -Werror -std=c99 code-examples/c/bit_ops.c -o test_bitops
          ./test_bitops

      - name: Test Command Parser
        run: |
          gcc -Wall -Wextra -Werror -std=c99 code-examples/c/command_parser.c -o test_parser
          ./test_parser

  markdown-link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Markdown Link Checker
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          check-modified-files-only: "no"
          config-file: ".github/linkcheck.json"
